name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: skill lint and leak grep
        run: node tools/check.mjs
      - name: city-driver-starter self-test (fake City, no network)
        run: node skills/city-driver-starter/scripts/selftest.mjs
      - name: honest-agent-guards self-test (no model, no network)
        run: node skills/honest-agent-guards/scripts/selftest.mjs
      - name: fleet-dashboard self-test (fake fleet, no network)
        run: node skills/fleet-dashboard/scripts/selftest.mjs
      - name: safe-logs self-test (no network)
        run: node skills/safe-logs/scripts/selftest.mjs
      - name: mirrored-workspace self-test (private tmux server, temporary folders)
        run: |
          sudo apt-get install -y -qq tmux >/dev/null
          bash skills/mirrored-workspace/scripts/selftest.sh
      - name: agent-owner-controls self-test (temporary folders, no network)
        run: node skills/agent-owner-controls/scripts/selftest.mjs
      - name: fleet-experiment-kit self-test and gates (invented crew, no network)
        run: |
          node skills/fleet-experiment-kit/scripts/selftest.mjs
          node skills/fleet-experiment-kit/scripts/xk.mjs gates --gates skills/fleet-experiment-kit/scripts/examples/receipt-gate.mjs
      - name: agent-memory-vault self-test (temporary vault, no network)
        run: bash skills/agent-memory-vault/scripts/selftest.sh
      - name: gitleaks (history and tree)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
          ./gitleaks dir . --redact --no-banner

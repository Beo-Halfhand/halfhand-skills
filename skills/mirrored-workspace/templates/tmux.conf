# mirrored-workspace: generated by install.sh from templates/tmux.conf. Re-run install.sh to change it.
# Every new session, window and split is logged through the masker (mw log). The hooks use index 77
# so they sit next to your own hooks instead of replacing them, and re-sourcing doesn't add copies.
# pipe-pane without -o replaces a pane's pipe; with -o it would toggle an existing pipe OFF.
set-hook -g after-new-session[77] 'pipe-pane "exec @MW@ log #{q:session_name}"'
set-hook -g after-new-window[77] 'pipe-pane "exec @MW@ log #{q:session_name}"'
set-hook -g after-split-window[77] 'pipe-pane "exec @MW@ log #{q:session_name}"'

# Attach from the laptop and the window fits the laptop; attach from the desk and it fits the desk.
set -g window-size latest
# The terminal's title is the tab name, so each terminal window says which job it is.
set -g set-titles on
set -g set-titles-string '#S'
